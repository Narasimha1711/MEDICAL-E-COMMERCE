name: Frontend CI/CD to Vercel

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
        working-directory: Frontend
      - name: Run Tests
        run: npm test
        working-directory: Frontend

  Deploy-Production:
    runs-on: ubuntu-latest
    needs: Test  # Only runs if the Test job passes
    if: github.ref == 'refs/heads/main'  # Only runs on pushes to main
    steps:
      - uses: actions/checkout@v3
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
        working-directory: Frontend
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
        working-directory: Frontend
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
        working-directory: Frontend

  Deploy-Preview:
    runs-on: ubuntu-latest
    needs: Test  # Only runs if the Test job passes
    if: github.ref != 'refs/heads/main'  # Runs on pull requests
    steps:
      - uses: actions/checkout@v3
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
        working-directory: Frontend
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
        working-directory: Frontend
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_FRONTEND_TOKEN }}
        working-directory: Frontend




